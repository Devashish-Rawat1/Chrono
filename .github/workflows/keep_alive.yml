name: keep-alive

# Pings the hosted Chrono demo so Render's free tier doesn't spin the
# instance down between visits (it sleeps after ~15 min idle, and a cold
# start makes the first recruiter hit slow ~30-60s). Runs every 10 minutes.
#
# The URL is set via the CHRONO_URL repo secret so it isn't hardcoded here.
# SET IT UP:
#   Repo -> Settings -> Secrets and variables -> Actions -> New repository
#   secret -> Name: CHRONO_URL  Value: https://chrono-60aj.onrender.com
# You can also trigger a run by hand from the Actions tab (workflow_dispatch).
#
# NOTE: GitHub pauses scheduled workflows on repos with no activity for
# ~60 days; any push or a manual run re-enables them.

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (UTC)
  workflow_dispatch: {}        # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: |
          URL="${{ secrets.CHRONO_URL }}"
          if [ -z "$URL" ]; then
            echo "CHRONO_URL secret is not set; skipping."
            exit 0
          fi
          echo "Pinging $URL ..."
          # -f fail on HTTP >=400, -s silent, -S show errors, -L follow
          # redirects, --max-time caps the wait so a cold start doesn't hang
          # the job. Retry a few times to ride through the wake-up.
          curl -fsSL --max-time 60 \
               --retry 3 --retry-delay 15 --retry-all-errors \
               "$URL" -o /dev/null
          echo "Ping OK."